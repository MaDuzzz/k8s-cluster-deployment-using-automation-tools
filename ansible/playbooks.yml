---
- name: Prepare and Install all neccessary packages for all nodes in cluster
  hosts: cluster
  become: true
  remote_user: "{{ ansible_user }}"
  gather_facts: true
  roles:
    - general
    - docker
    - k8s-general

- name: Config vip address for master node
  hosts: masternode
  become: true
  remote_user: "{{ ansible_user }}"
  gather_facts: true
  roles:
    - role: vip_config
      tags: keepalived
    - role: loadbalancer
      tags: haproxy

- name: Prepare and Initialize first master node
  hosts: masternode[0]
  become: true
  remote_user: "{{ ansible_user }}"
  roles:
    - k8s-initmaster

- name: Join all master nodes into cluster
  hosts: masternode[1:]
  become: true
  remote_user: "{{ ansible_user }}"
  roles:
    - k8s-joinmaster

- name: Join all worker nodes into cluster
  hosts: workernodes
  become: true
  remote_user: "{{ ansible_user }}"
  roles:
    - k8s-joinworker
